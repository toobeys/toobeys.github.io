<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dashboard Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #071126;
      color: #fff;
      padding: 30px 15px;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitle {
      color: #9ca3af;
      margin-bottom: 30px;
    }

    .card {
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 20px;
      backdrop-filter: blur(14px);
    }

    .card h2 {
      margin-top: 0;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      color: #cbd5e1;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.15);
      background: rgba(0,0,0,.25);
      color: white;
      outline: none;
      margin-bottom: 16px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #60a5fa;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 11px 16px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-primary {
      background: #3b82f6;
      color: white;
    }

    .btn-danger {
      background: #ef4444;
      color: white;
    }

    .btn-secondary {
      background: rgba(255,255,255,.1);
      color: white;
    }

    .btn-success {
      background: #10b981;
      color: white;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .profile-preview {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 20px;
    }

    .profile-preview img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255,255,255,.2);
    }

    .profile-preview-info {
      flex: 1;
    }

    .upload-label {
      display: inline-block;
      padding: 10px 14px;
      background: rgba(255,255,255,.1);
      border-radius: 10px;
      cursor: pointer;
      margin-bottom: 0;
    }

    .upload-label:hover {
      background: rgba(255,255,255,.16);
    }

    .upload-label input {
      display: none;
    }

    .link-item {
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 15px;
      background: rgba(0,0,0,.16);
    }

    .link-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    .link-number {
      font-weight: bold;
      color: #93c5fd;
    }

    .icon-preview-area {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 15px;
    }

    .icon-preview {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      object-fit: cover;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.15);
    }

    .icon-placeholder {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      background: rgba(255,255,255,.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
    }

    .icon-upload {
      flex: 1;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 5px;
    }

    .checkbox-row input {
      width: auto;
      margin: 0;
    }

    .save-bar {
      position: sticky;
      bottom: 15px;
      background: rgba(7,17,38,.9);
      border: 1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(15px);
      padding: 15px;
      border-radius: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-top: 25px;
    }

    .status {
      font-size: 14px;
      color: #9ca3af;
    }

    .theme-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    @media (max-width: 650px) {
      .theme-grid {
        grid-template-columns: 1fr;
      }

      .profile-preview {
        align-items: flex-start;
      }

      .save-bar {
        flex-direction: column;
        align-items: stretch;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>⚙️ Admin Dashboard</h1>
  <div class="subtitle">Kelola halaman Nendar tanpa mengedit kode.</div>

  <!-- ========================= -->
  <!-- PROFILE -->
  <!-- ========================= -->

  <section class="card">

    <h2>👤 Profil</h2>

    <div class="profile-preview">

      <img
        id="profilePreview"
        src="profile.png"
        alt="Preview foto profil"
      >

      <div class="profile-preview-info">

        <label class="upload-label">
          📷 Ganti Foto Profil
          <input
            type="file"
            id="profileImage"
            accept="image/*"
          >
        </label>

        <div style="margin-top:10px;color:#94a3b8;font-size:13px;">
          JPG, PNG atau WEBP
        </div>

        <button
          type="button"
          class="btn-danger"
          id="deleteProfileImage"
          style="margin-top:10px;"
        >
          Hapus Foto
        </button>

      </div>

    </div>

    <label>Nama</label>
    <input
      type="text"
      id="profileName"
      placeholder="Nendar"
    >

    <label>Subtitle</label>
    <input
      type="text"
      id="profileSubtitle"
      placeholder="Gaming • Creator"
    >

    <label>Bio</label>
    <textarea
      id="profileBio"
      placeholder="Terima kasih sudah berkunjung!"
    ></textarea>

  </section>


  <!-- ========================= -->
  <!-- LINKS -->
  <!-- ========================= -->

  <section class="card">

    <h2>🔗 Link Utama</h2>

    <div id="linksContainer">
      Memuat link...
    </div>

    <button
      type="button"
      class="btn-secondary"
      id="addLink"
    >
      ＋ Tambah Link
    </button>

  </section>


  <!-- ========================= -->
  <!-- THEME -->
  <!-- ========================= -->

  <section class="card">

    <h2>🎨 Tema</h2>

    <div class="theme-grid">

      <div>
        <label>Background</label>

        <select id="backgroundType">
          <option value="aurora">Aurora</option>
          <option value="gradient">Gradient</option>
        </select>
      </div>

      <div>
        <label>Gaya Kartu</label>

        <select id="cardStyle">
          <option value="glass">Glass</option>
        </select>
      </div>

      <div>
        <label>Warna Utama</label>

        <input
          type="color"
          id="primaryColor"
        >
      </div>

      <div>
        <label>Warna Sekunder</label>

        <input
          type="color"
          id="secondaryColor"
        >
      </div>

    </div>

  </section>


  <!-- ========================= -->
  <!-- SAVE -->
  <!-- ========================= -->

  <div class="save-bar">

    <div
      class="status"
      id="status"
    >
      Siap.
    </div>

    <div class="actions">

      <button
        type="button"
        class="btn-secondary"
        id="logout"
      >
        Logout
      </button>

      <button
        type="button"
        class="btn-success"
        id="saveAll"
      >
        💾 Simpan Semua
      </button>

    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://arcnrdjnlxcauhiplgfr.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_lMT3wM9dhoC6nuF5-b5w5g_suNRS3qD";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let linksData = [];
let profileData = null;
let themeData = null;


/* =========================================
   INIT
========================================= */

async function init() {

  const {
    data: {
      session
    }
  } = await supabaseClient.auth.getSession();


  if (!session) {
    window.location.href = "admin.html";
    return;
  }


  await loadProfile();
  await loadLinks();
  await loadTheme();

}


/* =========================================
   PROFILE
========================================= */

async function loadProfile() {

  const {
    data,
    error
  } = await supabaseClient
    .from("profiles")
    .select("*")
    .limit(1)
    .maybeSingle();


  if (error) {

    console.error(error);

    setStatus(
      "Gagal memuat profil."
    );

    return;
  }


  profileData = data;


  if (!data) {
    return;
  }


  document.getElementById(
    "profileName"
  ).value = data.name || "";


  document.getElementById(
    "profileSubtitle"
  ).value = data.subtitle || "";


  document.getElementById(
    "profileBio"
  ).value = data.bio || "";


  if (data.avatar_url) {

    document.getElementById(
      "profilePreview"
    ).src = data.avatar_url;

  }

}


/* =========================================
   PROFILE IMAGE
========================================= */

document
  .getElementById("profileImage")
  .addEventListener(
    "change",
    async function () {

      const file = this.files[0];

      if (!file) {
        return;
      }


      setStatus(
        "Mengupload foto profil..."
      );


      const extension =
        file.name
          .split(".")
          .pop()
          .toLowerCase();


      const fileName =
        "profile/profile-" +
        Date.now() +
        "." +
        extension;


      const {
        error: uploadError
      } = await supabaseClient
        .storage
        .from("link-thumbnails")
        .upload(
          fileName,
          file,
          {
            upsert: true
          }
        );


      if (uploadError) {

        console.error(
          uploadError
        );

        setStatus(
          "Upload foto gagal."
        );

        return;
      }


      const {
        data
      } =
        supabaseClient
          .storage
          .from("link-thumbnails")
          .getPublicUrl(
            fileName
          );


      document.getElementById(
        "profilePreview"
      ).src =
        data.publicUrl;


      if (profileData) {

        profileData.avatar_url =
          data.publicUrl;

      }


      setStatus(
        "Foto profil siap disimpan."
      );

    }
  );


/* =========================================
   DELETE PROFILE IMAGE
========================================= */

document
  .getElementById(
    "deleteProfileImage"
  )
  .addEventListener(
    "click",
    function () {

      if (!profileData) {
        return;
      }


      profileData.avatar_url =
        null;


      document.getElementById(
        "profilePreview"
      ).src =
        "profile.png";


      setStatus(
        "Foto profil akan dihapus saat disimpan."
      );

    }
  );


/* =========================================
   LINKS
========================================= */

async function loadLinks() {

  const {
    data,
    error
  } = await supabaseClient
    .from("links")
    .select("*")
    .order(
      "sort_order",
      {
        ascending: true
      }
    );


  if (error) {

    console.error(error);

    document.getElementById(
      "linksContainer"
    ).innerHTML =
      "Gagal memuat link.";

    return;
  }


  linksData = data || [];

  renderLinks();

}


/* =========================================
   RENDER LINKS
========================================= */

function renderLinks() {

  const container =
    document.getElementById(
      "linksContainer"
    );


  if (!linksData.length) {

    container.innerHTML =
      "<p style='color:#94a3b8;'>Belum ada link.</p>";

    return;
  }


  container.innerHTML = "";


  linksData.forEach(
    (link, index) => {

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "link-item";


      item.innerHTML = `

        <div class="link-header">

          <div class="link-number">
            Link ${index + 1}
          </div>

          <button
            type="button"
            class="btn-danger"
            onclick="deleteLink(${index})"
          >
            Hapus
          </button>

        </div>


        <div class="icon-preview-area">

          ${
            link.icon_url
              ?
              `
              <img
                id="iconPreview-${index}"
                class="icon-preview"
                src="${escapeHtml(link.icon_url)}"
              >
              `
              :
              `
              <div
                id="iconPreview-${index}"
                class="icon-placeholder"
              >
                ${link.icon || "🔗"}
              </div>
              `
          }


          <div class="icon-upload">

            <label class="upload-label">

              🖼️ Upload Icon

              <input
                type="file"
                accept="image/*"
                onchange="uploadLinkIcon(${index}, this)"
              >

            </label>


            ${
              link.icon_url
                ?
                `
                <button
                  type="button"
                  class="btn-danger"
                  style="margin-left:8px;"
                  onclick="deleteLinkIcon(${index})"
                >
                  Hapus Icon
                </button>
                `
                :
                ""
            }

            <div
              style="
                margin-top:8px;
                color:#94a3b8;
                font-size:12px;
              "
            >
              Icon gambar untuk kartu link.
            </div>

          </div>

        </div>


        <label>Judul Link</label>

        <input
          type="text"
          value="${escapeAttribute(link.title || "")}"
          oninput="linksData[${index}].title=this.value"
        >


        <label>Deskripsi</label>

        <input
          type="text"
          value="${escapeAttribute(link.description || "")}"
          oninput="linksData[${index}].description=this.value"
        >


        <label>URL</label>

        <input
          type="url"
          value="${escapeAttribute(link.url || "")}"
          placeholder="https://..."
          oninput="linksData[${index}].url=this.value"
        >


        <label>Emoji fallback</label>

        <input
          type="text"
          value="${escapeAttribute(link.icon || "🔗")}"
          oninput="linksData[${index}].icon=this.value"
        >


        <label>Urutan</label>

        <input
          type="number"
          value="${link.sort_order ?? index + 1}"
          oninput="linksData[${index}].sort_order=Number(this.value)"
        >


        <div class="checkbox-row">

          <input
            type="checkbox"
            ${link.is_active ? "checked" : ""}
            onchange="linksData[${index}].is_active=this.checked"
          >

          <span>
            Tampilkan link ini
          </span>

        </div>

      `;


      container.appendChild(
        item
      );

    }
  );

}


/* =========================================
   UPLOAD LINK ICON
========================================= */

async function uploadLinkIcon(
  index,
  input
) {

  const file =
    input.files[0];


  if (!file) {
    return;
  }


  setStatus(
    "Mengupload icon..."
  );


  const extension =
    file.name
      .split(".")
      .pop()
      .toLowerCase();


  const fileName =
    "icons/icon-" +
    Date.now() +
    "-" +
    index +
    "." +
    extension;


  const {
    error
  } = await supabaseClient
    .storage
    .from("link-thumbnails")
    .upload(
      fileName,
      file,
      {
        upsert: true
      }
    );


  if (error) {

    console.error(error);

    setStatus(
      "Upload icon gagal."
    );

    return;
  }


  const {
    data
  } =
    supabaseClient
      .storage
      .from("link-thumbnails")
      .getPublicUrl(
        fileName
      );


  linksData[index].icon_url =
    data.publicUrl;


  renderLinks();


  setStatus(
    "Icon siap disimpan."
  );

}


/* =========================================
   DELETE LINK ICON
========================================= */

function deleteLinkIcon(index) {

  linksData[index].icon_url =
    null;


  renderLinks();


  setStatus(
    "Icon akan dihapus saat disimpan."
  );

}


/* =========================================
   ADD LINK
========================================= */

document
  .getElementById("addLink")
  .addEventListener(
    "click",
    function () {

      linksData.push({

        title:
          "Link Baru",

        description:
          "",

        url:
          "#",

        icon:
          "🔗",

        icon_url:
          null,

        sort_order:
          linksData.length + 1,

        is_active:
          true

      });


      renderLinks();

    }
  );


/* =========================================
   DELETE LINK
========================================= */

function deleteLink(index) {

  const link =
    linksData[index];


  if (
    !confirm(
      `Hapus link "${link.title}"?`
    )
  ) {

    return;

  }


  linksData.splice(
    index,
    1
  );


  renderLinks();

}


/* =========================================
   THEME
========================================= */

async function loadTheme() {

  const {
    data,
    error
  } = await supabaseClient
    .from("themes")
    .select("*")
    .limit(1)
    .maybeSingle();


  if (error) {

    console.error(error);

    return;
  }


  themeData = data;


  if (!data) {
    return;
  }


  document.getElementById(
    "backgroundType"
  ).value =
    data.background_type ||
    "aurora";


  document.getElementById(
    "cardStyle"
  ).value =
    data.card_style ||
    "glass";


  document.getElementById(
    "primaryColor"
  ).value =
    data.primary_color ||
    "#3b82f6";


  document.getElementById(
    "secondaryColor"
  ).value =
    data.secondary_color ||
    "#8b5cf6";

}


/* =========================================
   SAVE ALL
========================================= */

document
  .getElementById("saveAll")
  .addEventListener(
    "click",
    saveAll
  );


async function saveAll() {

  setStatus(
    "Menyimpan..."
  );


  try {

    /* PROFILE */

    const profileUpdate = {

      name:
        document.getElementById(
          "profileName"
        ).value.trim(),

      subtitle:
        document.getElementById(
          "profileSubtitle"
        ).value.trim(),

      bio:
        document.getElementById(
          "profileBio"
        ).value.trim(),

      avatar_url:
        profileData
          ? profileData.avatar_url
          : null,

      updated_at:
        new Date().toISOString()

    };


    if (profileData?.id) {

      const {
        error
      } =
        await supabaseClient
          .from("profiles")
          .update(
            profileUpdate
          )
          .eq(
            "id",
            profileData.id
          );


      if (error) {
        throw error;
      }

    }


    /* LINKS */

    for (
      const link of linksData
    ) {

      if (link.id) {

        const {
          error
        } =
          await supabaseClient
            .from("links")
            .update({

              title:
                link.title,

              description:
                link.description,

              url:
                link.url,

              icon:
                link.icon,

              icon_url:
                link.icon_url,

              sort_order:
                link.sort_order,

              is_active:
                link.is_active,

              updated_at:
                new Date().toISOString()

            })
            .eq(
              "id",
              link.id
            );


        if (error) {
          throw error;
        }

      } else {

        const {
          error
        } =
          await supabaseClient
            .from("links")
            .insert({

              title:
                link.title,

              description:
                link.description,

              url:
                link.url,

              icon:
                link.icon,

              icon_url:
                link.icon_url,

              sort_order:
                link.sort_order,

              is_active:
                link.is_active

            });


        if (error) {
          throw error;
        }

      }

    }


    /* THEME */

    if (themeData?.id) {

      const {
        error
      } =
        await supabaseClient
          .from("themes")
          .update({

            background_type:
              document.getElementById(
                "backgroundType"
              ).value,

            primary_color:
              document.getElementById(
                "primaryColor"
              ).value,

            secondary_color:
              document.getElementById(
                "secondaryColor"
              ).value,

            card_style:
              document.getElementById(
                "cardStyle"
              ).value,

            updated_at:
              new Date().toISOString()

          })
          .eq(
            "id",
            themeData.id
          );


      if (error) {
        throw error;
      }

    }


    await loadProfile();
    await loadLinks();
    await loadTheme();


    setStatus(
      "✅ Semua perubahan berhasil disimpan."
    );


  } catch (error) {

    console.error(error);

    setStatus(
      "❌ Gagal menyimpan: " +
      error.message
    );

  }

}


/* =========================================
   LOGOUT
========================================= */

document
  .getElementById("logout")
  .addEventListener(
    "click",
    async function () {

      await supabaseClient
        .auth
        .signOut();

      window.location.href =
        "admin.html";

    }
  );


/* =========================================
   HELPERS
========================================= */

function setStatus(text) {

  document.getElementById(
    "status"
  ).textContent = text;

}


function escapeHtml(value) {

  return String(value || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


function escapeAttribute(value) {

  return escapeHtml(value);

}


init();

</script>

</body>
</html>
