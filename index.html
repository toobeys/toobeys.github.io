<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#071126">

  <meta
    name="description"
    content="Toobey — Gaming • Creator"
  >

  <title>Toobey - FavLink</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Background -->
  <div class="bg" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
    <span class="grid"></span>
  </div>

  <main class="page">

    <!-- Theme Toggle -->
    <button
      class="theme-toggle"
      id="themeToggle"
      aria-label="Ganti tema"
      title="Ganti tema"
      type="button"
    >
      ☾
    </button>


    <!-- Profile -->
    <section class="profile">

      <div class="avatar-wrap">

        <img
          src="profile.png"
          alt="Foto profil Toobey"
          class="avatar"
          id="profileAvatar"
        >

      </div>


      <h1 id="profileName">Toobey</h1>


      <p
        class="subtitle"
        id="profileSubtitle"
      >
        Gaming <span>•</span> Creator
      </p>


      <p
        class="welcome"
        id="profileBio"
      >
        Selamat datang di halaman Toobey!
      </p>


      <div class="divider">

        <span></span>

        <b>🎮</b>

        <span></span>

      </div>

    </section>


    <!-- Main Links -->
    <section
      class="links"
      aria-label="Link utama"
      id="links"
    ></section>


    <!-- Social -->
    <section class="social">

      <div class="social-title">

        <span></span>

        <em>Follow Me</em>

        <span></span>

      </div>


      <div
        class="social-list"
        id="socialLinks"
      ></div>

    </section>


    <!-- Footer -->
    <footer>
      © 2026 Toobey • All Rights Reserved
    </footer>


  </main>


  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <!-- Main Script -->
  <script src="script.js"></script>

</body>
</html>
