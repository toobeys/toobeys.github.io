<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071126">
  <meta name="description" content="Nendar — Gaming • Creator">

      <p class="welcome">Terima kasih sudah berkunjung!</p>
      <div class="divider"><span></span><b>🎮</b><span></span></div>
    </section>

    <section class="links" aria-label="Link utama" id="links"></section>

    <section class="social">
      <div class="social-title"><span></span><em>Follow Me</em><span></span></div>
      <div class="social-list" id="socialLinks"></div>
    </section>

    <footer>Nendar • Gaming & Creator</footer>
  </main>

  <script src="script.js"></script>

</html>
